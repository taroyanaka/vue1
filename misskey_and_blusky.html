<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misskey & Bluesky Note Poster</title>
    <script src="./vue3.js"></script>
    <style>
        /* inputの長さを2文字に */
        #misskeyApiToken {
            width: 2rem;
        }
        .preview-container {
            margin: 10px 0;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            display: block;
            margin-bottom: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .response-message {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div>
            <a href="https://bsky.app/profile/taro-yanaka.bsky.social">taro-yanaka.bsky.social</a>
        </div>
        <div>
            <a href="https://misskey.io/@yanaka">https://misskey.io/@yanaka</a>
        </div>
        <div>
            <a href="https://taroyanaka.github.io/vue1/misskey_and_blusky.html">https://taroyanaka.github.io/vue1/misskey_and_blusky.html</a>
        </div>

        <h1>Misskey & Bluesky Note Poster</h1>
        <div>
            misskeyApiToken<input type="text" id="misskeyApiToken" v-model="misskeyApiToken" autocomplete="on">
            blueskyPassword: <input type="password" id="blueskyPassword" v-model="blueskyPassword" autocomplete="on">
            
            <div>
                <textarea id="noteContent" v-model="noteContent" placeholder="text of the note" cols="30" rows="10"></textarea>
            </div>

            <!-- 画像選択・貼り付けエリア -->
            <div style="margin: 10px 0;">
                <label>画像（1枚のみ / <b>Ctrl+V での貼り付けにも対応</b>）: </label>
                <input type="file" ref="fileInput" accept="image/*" @change="onFileChange">
                <div v-if="imagePreviewUrl" class="preview-container">
                    <img :src="imagePreviewUrl" class="preview-image" alt="プレビュー">
                    <button type="button" @click="clearImage">画像を削除</button>
                </div>
            </div>

            <!-- テキストまたは画像が存在する場合に投稿可能 -->
            <div v-if="misskeyApiToken && blueskyApiToken && (noteContent || selectedFile)">
                <input type="submit" @click="postNote" :disabled="isPosting" :value="isPosting ? '投稿中...' : 'misskeyとblueskyに投稿'">
            </div>
        </div>

        <div>
            <div v-if="!blueskyApiToken">
                <button @click="get_accessJwt">get_accessJwt</button>
            </div>
            <input type="hidden" id="blueskyApiToken" v-model="blueskyApiToken">
            {{ blueskyApiToken ? "blue sky api token is set, ready" : "" }}
        </div>
        <div v-if="responseMessage" class="response-message">{{ responseMessage }}</div>
        <div>
            version 0.8
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    blueskyPassword: '',
                    misskeyApiToken: '',
                    blueskyApiToken: '',
                    noteContent: '',
                    selectedFile: null,
                    imagePreviewUrl: '',
                    responseMessage: '',
                    isPosting: false
                };
            },
            mounted() {
                // 画面全体のペーストイベント（Ctrl+V）を監視
                window.addEventListener('paste', this.handlePaste);
            },
            beforeUnmount() {
                window.removeEventListener('paste', this.handlePaste);
            },
            methods: {
                async get_accessJwt() {
                    const identifier = "taro-yanaka.bsky.social";
                    const password = this.blueskyPassword;

                    try {
                        const response = await fetch('https://bsky.social/xrpc/com.atproto.server.createSession', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                identifier: identifier,
                                password: password
                            })
                        });
                        const data = await response.json();
                        if (response.ok && data.accessJwt) {
                            this.blueskyApiToken = data.accessJwt;
                            this.responseMessage = 'Blueskyのセッション作成に成功しました。';
                        } else {
                            this.responseMessage = 'Blueskyのセッション作成に失敗しました: ' + (data.message || '');
                        }
                    } catch (error) {
                        this.responseMessage = 'Blueskyセッション取得エラー: ' + error.message;
                    }
                },

                // ファイル選択時
                onFileChange(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.setFile(file);
                    }
                },

                // 画像ファイルをセット（プレビュー生成）
                setFile(file) {
                    this.selectedFile = file;
                    if (this.imagePreviewUrl) {
                        URL.revokeObjectURL(this.imagePreviewUrl);
                    }
                    this.imagePreviewUrl = URL.createObjectURL(file);
                },

                // クリップボード貼り付けイベントの処理
                handlePaste(event) {
                    const clipboardData = event.clipboardData || window.clipboardData;
                    if (!clipboardData || !clipboardData.items) return;

                    for (let i = 0; i < clipboardData.items.length; i++) {
                        const item = clipboardData.items[i];
                        if (item.type.indexOf('image') !== -1) {
                            const file = item.getAsFile();
                            if (file) {
                                this.setFile(file);
                                event.preventDefault(); // テキストエリア等への不要なバイナリ文字列等の挿入を抑止
                                break;
                            }
                        }
                    }
                },

                // 画像の選択解除
                clearImage() {
                    this.selectedFile = null;
                    if (this.imagePreviewUrl) {
                        URL.revokeObjectURL(this.imagePreviewUrl);
                        this.imagePreviewUrl = '';
                    }
                    if (this.$refs.fileInput) {
                        this.$refs.fileInput.value = '';
                    }
                },

                // Misskeyに画像をアップロードして fileId を取得
                async uploadMisskeyImage(file) {
                    const formData = new FormData();
                    formData.append('i', this.misskeyApiToken);
                    formData.append('file', file);

                    const response = await fetch('https://misskey.io/api/drive/files/create', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        let msg = err.error?.message || response.statusText;
                        if (msg.includes('permissions')) {
                            msg += '（※トークンに「ドライブのファイルを操作する」権限が必要です）';
                        }
                        throw new Error('画像アップロード失敗: ' + msg);
                    }
                    const data = await response.json();
                    return data.id; // fileId
                },

                // Blueskyに画像をアップロードして blob オブジェクトを取得
                async uploadBlueskyImage(file) {
                    const response = await fetch('https://bsky.social/xrpc/com.atproto.repo.uploadBlob', {
                        method: 'POST',
                        headers: {
                            'Content-Type': file.type || 'image/jpeg',
                            'Authorization': `Bearer ${this.blueskyApiToken}`
                        },
                        body: file
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        let msg = err.message || err.error || response.statusText;
                        if (response.status === 400 && file.size > 1000000) {
                            msg += '（※画像サイズが1MBを超えている可能性があります）';
                        }
                        throw new Error('画像アップロード失敗: ' + msg);
                    }
                    const data = await response.json();
                    return data.blob;
                },

                // Misskeyへの投稿処理（画像＋テキスト）
                async postToMisskey() {
                    try {
                        let fileId = null;
                        if (this.selectedFile) {
                            fileId = await this.uploadMisskeyImage(this.selectedFile);
                        }

                        const payload = {
                            i: this.misskeyApiToken
                        };
                        if (this.noteContent) payload.text = this.noteContent;
                        if (fileId) payload.fileIds = [fileId];

                        const res = await fetch('https://misskey.io/api/notes/create', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            throw new Error('ノート作成失敗: ' + (err.error?.message || res.statusText));
                        }
                        return { success: true };
                    } catch (e) {
                        return { success: false, error: e.message };
                    }
                },

                // Blueskyへの投稿処理（画像＋テキスト）
                async postToBluesky() {
                    try {
                        let blob = null;
                        if (this.selectedFile) {
                            blob = await this.uploadBlueskyImage(this.selectedFile);
                        }

                        const record = {
                            text: this.noteContent || '',
                            createdAt: new Date().toISOString()
                        };
                        if (blob) {
                            record.embed = {
                                $type: 'app.bsky.embed.images',
                                images: [
                                    {
                                        image: blob,
                                        alt: ''
                                    }
                                ]
                            };
                        }

                        const res = await fetch('https://bsky.social/xrpc/com.atproto.repo.createRecord', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.blueskyApiToken}`
                            },
                            body: JSON.stringify({
                                repo: 'taro-yanaka.bsky.social',
                                collection: 'app.bsky.feed.post',
                                record: record
                            })
                        });

                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            throw new Error('ポスト作成失敗: ' + (err.message || err.error || res.statusText));
                        }
                        return { success: true };
                    } catch (e) {
                        return { success: false, error: e.message };
                    }
                },

                async postNote() {
                    this.isPosting = true;
                    this.responseMessage = '投稿処理中...';

                    // MisskeyとBlueskyを独立して実行
                    const [misskeyResult, blueskyResult] = await Promise.all([
                        this.postToMisskey(),
                        this.postToBluesky()
                    ]);

                    const results = [];
                    if (misskeyResult.success) {
                        results.push('【Misskey】: 投稿成功！');
                    } else {
                        results.push('【Misskey】: ' + misskeyResult.error);
                    }

                    if (blueskyResult.success) {
                        results.push('【Bluesky】: 投稿成功！');
                    } else {
                        results.push('【Bluesky】: ' + blueskyResult.error);
                    }

                    this.responseMessage = results.join('\n');

                    // 両方成功した場合はフォームをクリア
                    if (misskeyResult.success && blueskyResult.success) {
                        this.noteContent = '';
                        this.clearImage();
                    }
                    this.isPosting = false;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
