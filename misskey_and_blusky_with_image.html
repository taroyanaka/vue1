<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misskey & Bluesky Note Poster With Image</title>
    <script src="./vue3.js"></script>
    <style>
        /* inputの長さを2文字に */
        #misskeyApiToken {
            width: 2rem;
        }
        .preview-container {
            margin: 10px 0;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            display: block;
            margin-bottom: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="app">
        <div>
            <a href="https://bsky.app/profile/taro-yanaka.bsky.social">taro-yanaka.bsky.social</a>
        </div>
        <div>
            <a href="https://misskey.io/@yanaka">https://misskey.io/@yanaka</a>
        </div>
        <div>
            <a href="https://taroyanaka.github.io/vue1/misskey_and_blusky.html">https://taroyanaka.github.io/vue1/misskey_and_blusky.html</a>
        </div>

        <h1>Misskey & Bluesky Note Poster</h1>
        <div>
            misskeyApiToken<input type="text" id="misskeyApiToken" v-model="misskeyApiToken" autocomplete="on">
            blueskyPassword: <input type="password" id="blueskyPassword" v-model="blueskyPassword" autocomplete="on">
            
            <div>
                <textarea id="noteContent" v-model="noteContent" placeholder="text of the note" cols="30" rows="10"></textarea>
            </div>

            <!-- 画像選択エリア -->
            <div style="margin: 10px 0;">
                <label>画像（1枚のみ）: </label>
                <input type="file" ref="fileInput" accept="image/*" @change="onFileChange">
                <div v-if="imagePreviewUrl" class="preview-container">
                    <img :src="imagePreviewUrl" class="preview-image" alt="プレビュー">
                    <button type="button" @click="clearImage">画像を削除</button>
                </div>
            </div>

            <!-- テキストまたは画像が存在する場合に投稿可能 -->
            <div v-if="misskeyApiToken && blueskyApiToken && (noteContent || selectedFile)">
                <input type="submit" @click="postNote" :disabled="isPosting" :value="isPosting ? '投稿中...' : 'misskeyとblueskyに投稿'">
            </div>
        </div>

        <div>
            <div v-if="!blueskyApiToken">
                <button @click="get_accessJwt">get_accessJwt</button>
            </div>
            <input type="hidden" id="blueskyApiToken" v-model="blueskyApiToken">
            {{ blueskyApiToken ? "blue sky api token is set, ready" : "" }}
        </div>
        <p v-if="responseMessage">{{ responseMessage }}</p>
        <div>
            version 0.6
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    blueskyPassword: '',
                    misskeyApiToken: '',
                    blueskyApiToken: '',
                    noteContent: '',
                    selectedFile: null,
                    imagePreviewUrl: '',
                    responseMessage: '',
                    isPosting: false
                };
            },
            methods: {
                async get_accessJwt() {
                    const identifier = "taro-yanaka.bsky.social";
                    const password = this.blueskyPassword;

                    try {
                        const response = await fetch('https://bsky.social/xrpc/com.atproto.server.createSession', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                identifier: identifier,
                                password: password
                            })
                        });
                        const data = await response.json();
                        if (response.ok && data.accessJwt) {
                            this.blueskyApiToken = data.accessJwt;
                            this.responseMessage = 'Blueskyのセッション作成に成功しました。';
                        } else {
                            this.responseMessage = 'Blueskyのセッション作成に失敗しました: ' + (data.message || '');
                        }
                    } catch (error) {
                        this.responseMessage = 'Blueskyセッション取得エラー: ' + error.message;
                    }
                },

                // ファイル選択時
                onFileChange(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.selectedFile = file;
                        this.imagePreviewUrl = URL.createObjectURL(file);
                    }
                },

                // 画像の選択解除
                clearImage() {
                    this.selectedFile = null;
                    if (this.imagePreviewUrl) {
                        URL.revokeObjectURL(this.imagePreviewUrl);
                        this.imagePreviewUrl = '';
                    }
                    if (this.$refs.fileInput) {
                        this.$refs.fileInput.value = '';
                    }
                },

                // Misskeyに画像をアップロードして fileId を取得
                async uploadMisskeyImage(file) {
                    const formData = new FormData();
                    formData.append('i', this.misskeyApiToken);
                    formData.append('file', file);

                    const response = await fetch('https://misskey.io/api/drive/files/create', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error('Misskey画像アップロード失敗: ' + (err.error?.message || response.statusText));
                    }
                    const data = await response.json();
                    return data.id; // fileId
                },

                // Blueskyに画像をアップロードして blob オブジェクトを取得
                async uploadBlueskyImage(file) {
                    const response = await fetch('https://bsky.social/xrpc/com.atproto.repo.uploadBlob', {
                        method: 'POST',
                        headers: {
                            'Content-Type': file.type,
                            'Authorization': `Bearer ${this.blueskyApiToken}`
                        },
                        body: file
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error('Bluesky画像アップロード失敗: ' + (err.message || response.statusText));
                    }
                    const data = await response.json();
                    return data.blob;
                },

                async postNote() {
                    this.isPosting = true;
                    this.responseMessage = '投稿処理中...';

                    try {
                        let misskeyFileId = null;
                        let blueskyBlob = null;

                        // 画像が選択されている場合、各サービスに画像アップロード
                        if (this.selectedFile) {
                            [misskeyFileId, blueskyBlob] = await Promise.all([
                                this.uploadMisskeyImage(this.selectedFile),
                                this.uploadBlueskyImage(this.selectedFile)
                            ]);
                        }

                        // Misskey ペイロード作成
                        const misskeyUrl = 'https://misskey.io/api/notes/create';
                        const misskeyPayload = {
                            i: this.misskeyApiToken
                        };
                        if (this.noteContent) {
                            misskeyPayload.text = this.noteContent;
                        }
                        if (misskeyFileId) {
                            misskeyPayload.fileIds = [misskeyFileId];
                        }

                        // Bluesky ペイロード作成
                        const blueskyUrl = 'https://bsky.social/xrpc/com.atproto.repo.createRecord';
                        const blueskyRecord = {
                            text: this.noteContent || '', // 画像のみの時は空文字
                            createdAt: new Date().toISOString()
                        };
                        if (blueskyBlob) {
                            blueskyRecord.embed = {
                                $type: 'app.bsky.embed.images',
                                images: [
                                    {
                                        image: blueskyBlob,
                                        alt: '' // 代替テキスト
                                    }
                                ]
                            };
                        }

                        const blueskyPayload = {
                            repo: 'taro-yanaka.bsky.social',
                            collection: 'app.bsky.feed.post',
                            record: blueskyRecord
                        };

                        // 投稿実行
                        const [misskeyResponse, blueskyResponse] = await Promise.all([
                            fetch(misskeyUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(misskeyPayload)
                            }),
                            fetch(blueskyUrl, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${this.blueskyApiToken}`
                                },
                                body: JSON.stringify(blueskyPayload)
                            })
                        ]);

                        if (misskeyResponse.ok && blueskyResponse.ok) {
                            this.responseMessage = 'ノートがMisskeyとBlueskyに正常に投稿されました。';
                            // 投稿成功時に内容をクリア
                            this.noteContent = '';
                            this.clearImage();
                        } else {
                            const errMsgs = [];
                            if (!misskeyResponse.ok) errMsgs.push('Misskey投稿失敗');
                            if (!blueskyResponse.ok) errMsgs.push('Bluesky投稿失敗');
                            this.responseMessage = errMsgs.join(', ');
                        }
                    } catch (error) {
                        this.responseMessage = 'エラーが発生しました: ' + error.message;
                    } finally {
                        this.isPosting = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
```
